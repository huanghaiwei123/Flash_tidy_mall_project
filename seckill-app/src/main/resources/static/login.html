<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秒杀系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .container {
            background: #fff; border-radius: 12px; padding: 40px;
            width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; margin-bottom: 24px; color: #333; }
        .tabs { display: flex; margin-bottom: 24px; border-bottom: 2px solid #eee; }
        .tab {
            flex: 1; text-align: center; padding: 10px; cursor: pointer;
            color: #999; font-size: 16px; border-bottom: 2px solid transparent;
            margin-bottom: -2px; transition: all 0.2s;
        }
        .tab.active { color: #667eea; border-bottom-color: #667eea; font-weight: bold; }
        .form { display: none; }
        .form.active { display: block; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; }
        input {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd;
            border-radius: 6px; font-size: 14px; outline: none; transition: border 0.2s;
        }
        input:focus { border-color: #667eea; }
        button {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; border-radius: 6px; font-size: 16px;
            cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .msg { margin-top: 12px; text-align: center; font-size: 14px; color: #e74c3c; }
        .msg.success { color: #27ae60; }
    </style>
</head>
<body>
<div class="container">
    <h2>⚡ 秒杀系统</h2>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">登录</div>
        <div class="tab" onclick="switchTab('register')">注册</div>
    </div>

    <!-- 登录表单 -->
    <div id="login-form" class="form active">
        <div class="form-group">
            <label>手机号</label>
            <input type="text" id="login-phone" placeholder="请输入手机号">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="login-password" placeholder="请输入密码">
        </div>
        <button onclick="login()">登 录</button>
        <div id="login-msg" class="msg"></div>
    </div>

    <!-- 注册表单 -->
    <div id="register-form" class="form">
        <div class="form-group">
            <label>手机号</label>
            <input type="text" id="reg-phone" placeholder="请输入手机号">
        </div>
        <div class="form-group">
            <label>昵称</label>
            <input type="text" id="reg-nickname" placeholder="请输入昵称">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="reg-password" placeholder="至少6位，需包含大小写字母、数字和特殊字符">
        </div>
        <button onclick="register()">注 册</button>
        <div id="reg-msg" class="msg"></div>
    </div>
</div>

<script>
const BASE = 'http://your-server-host:8080/hhw'; // TODO: 替换为实际部署地址

function switchTab(type) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === (type === 'login' ? 0 : 1)));
    document.getElementById('login-form').classList.toggle('active', type === 'login');
    document.getElementById('register-form').classList.toggle('active', type === 'register');
}

function showMsg(id, text, isSuccess) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg' + (isSuccess ? ' success' : '');
}

async function login() {
    const phone = document.getElementById('login-phone').value.trim();
    const password = document.getElementById('login-password').value.trim();
    if (!phone || !password) { showMsg('login-msg', '请填写手机号和密码'); return; }

    try {
        const resp = await fetch(BASE + '/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, password })
        });
        const json = await resp.json();
        if (json.code === 200) {
            localStorage.setItem('token', json.data.token || json.data);
            localStorage.setItem('phone', phone);
            showMsg('login-msg', '登录成功，跳转中...', true);
            setTimeout(() => location.href = 'index.html', 800);
        } else {
            showMsg('login-msg', json.message || '登录失败');
        }
    } catch (e) {
        showMsg('login-msg', '网络错误，请检查后端是否启动');
    }
}

async function register() {
    const phone = document.getElementById('reg-phone').value.trim();
    const nickname = document.getElementById('reg-nickname').value.trim();
    const password = document.getElementById('reg-password').value.trim();
    if (!phone || !nickname || !password) { showMsg('reg-msg', '请填写所有字段'); return; }

    try {
        const resp = await fetch(BASE + '/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, nickname, password })
        });
        const json = await resp.json();
        if (json.code === 200) {
            showMsg('reg-msg', '注册成功，请切换回登录', true);
        } else {
            showMsg('reg-msg', json.message || '注册失败');
        }
    } catch (e) {
        showMsg('reg-msg', '网络错误，请检查后端是否启动');
    }
}
</script>
</body>
</html>
