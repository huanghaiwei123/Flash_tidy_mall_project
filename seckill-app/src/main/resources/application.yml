spring:
  datasource:
   url: jdbc:mysql://localhost:3306/seckill_project?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
   username: root
   password: 123456
   driver-class-name: com.mysql.cj.jdbc.Driver

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  redis:
    timeout: 10000ms

    lettuce:
      pool:
        max-active: 200
        max-wait: 3000ms
        max-idle: 50
        min-idle: 10
    cluster:
      nodes:
        - 192.168.147.131:7000
        - 192.168.147.131:7001
        - 192.168.147.131:7002
        - 192.168.147.131:7003
        - 192.168.147.131:7004
        - 192.168.147.131:7005
      max-redirects: 3


  rabbitmq:
    host: 192.168.147.131
    port: 5672
    username: admin
    password: admin123
    listener:
      simple:
        retry:
          enabled: true        # 消费失败自动重试
          max-attempts: 3      # 最多重试 3 次
          initial-interval: 1000ms  # 重试间隔 1 秒
        prefetch: 50           # 每次预取 50 条，防止重启时瞬间冲垮消费者


jwt:
  secret: gdou-seckill-project-jwt-secret-key-2026 #秘钥，长度至少32位
  expiration:  3600000 #token过期时间，设置为60分钟

#开启mybatis-plus驼峰映射
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

alipay:
  app-id: 9021000166627774
  merchant-private-key: 
  alipay-public-key: 
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url:  http://qc6ca6cb.natappfree.cc/hhw/pay/notify
  return-url: http://localhost:8080/hhw/pay/return
  sign-type: RSA2
  charset: UTF-8
  format: json


server:
  tomcat:
    threads:
      max: 1000        # 最大工作线程
      min-spare: 100   # 最小空闲线程
    accept-count: 2000 # 等待队列长度



