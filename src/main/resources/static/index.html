<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秒杀系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f6fa; color: #333;
        }
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; padding: 16px 32px; display: flex;
            justify-content: space-between; align-items: center;
        }
        .header h2 { font-size: 20px; }
        .header button {
            padding: 6px 16px; background: rgba(255,255,255,0.2); color: #fff;
            border: 1px solid rgba(255,255,255,0.4); border-radius: 4px; cursor: pointer;
        }
        .header button:hover { background: rgba(255,255,255,0.3); }
        .content { max-width: 960px; margin: 0 auto; padding: 24px; }
        .section {
            background: #fff; border-radius: 8px; padding: 24px;
            margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .section h3 { margin-bottom: 16px; color: #667eea; border-bottom: 2px solid #667eea; padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f8f9fa; color: #666; font-weight: 600; }
        .btn {
            padding: 5px 14px; border: none; border-radius: 4px;
            font-size: 13px; cursor: pointer; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: #667eea; color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-warning { background: #f39c12; color: #fff; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .result-card {
            background: #f8f9fa; border-radius: 6px; padding: 16px;
            margin-top: 12px; font-size: 14px; line-height: 2;
        }
        .tag {
            display: inline-block; padding: 2px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 600;
        }
        .tag-unpay { background: #ffeaa7; color: #d68910; }
        .tag-paid { background: #c8e6c9; color: #2e7d32; }
        .tag-cancel { background: #e0e0e0; color: #616161; }
        .tag-refund { background: #bbdefb; color: #1565c0; }
        .msg { padding: 10px; text-align: center; border-radius: 4px; margin-top: 8px; }
        .msg.info { background: #e3f2fd; color: #1565c0; }
        .msg.error { background: #ffebee; color: #c62828; }
        .msg.success { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>
<div class="header">
    <h2>⚡ 秒杀系统</h2>
    <div>
        <span id="user-info" style="margin-right: 16px; font-size: 14px;"></span>
        <button onclick="logout()">退出登录</button>
    </div>
</div>

<div class="content">
    <!-- 商品列表 -->
    <div class="section">
        <h3>🔥 秒杀商品列表</h3>
        <table>
            <thead>
                <tr>
                    <th>商品名称</th>
                    <th>秒杀价</th>
                    <th>原价</th>
                    <th>库存</th>
                    <th>开始时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="product-list">
                <tr><td colspan="6" style="text-align:center;color:#999;">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 秒杀结果 -->
    <div class="section">
        <h3>📋 我的秒杀结果</h3>
        <div id="result-area"><div class="msg info">加载中...</div></div>
    </div>
</div>

<script>
const BASE = 'http://localhost:8080/hhw';
const TOKEN = localStorage.getItem('token');
const PHONE = localStorage.getItem('phone');

// 未登录跳回登录页
if (!TOKEN) { location.href = 'login.html'; }

document.getElementById('user-info').textContent = '👤 ' + PHONE;

function logout() {
    localStorage.clear();
    location.href = 'login.html';
}

// ====== 商品列表 ======
async function loadProducts() {
    const tbody = document.getElementById('product-list');
    try {
        const resp = await fetch(BASE + '/seckill/seckills');
        const json = await resp.json();
        const list = json.data || [];
        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;">暂无秒杀活动</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(p => `
            <tr>
                <td><strong>${p.name}</strong></td>
                <td style="color:#e74c3c;font-weight:bold;">¥${p.price}</td>
                <td style="text-decoration:line-through;color:#999;">¥${p.originalPrice}</td>
                <td>${p.number}</td>
                <td style="font-size:12px;">${formatTime(p.startTime)} ~ <br>${formatTime(p.endTime)}</td>
                <td><button class="btn btn-danger" onclick="doSeckill(${p.seckillId})">⚡ 立即秒杀</button></td>
            </tr>
        `).join('');
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#c62828;">加载失败</td></tr>';
    }
}

async function doSeckill(seckillId) {
    try {
        const resp = await fetch(`${BASE}/seckill/onseckill/${seckillId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN }
        });
        const json = await resp.json();
        if (json.code === 200) {
            setTimeout(() => loadResults(), 500);
        } else {
            showResultMsg(json.message || '秒杀失败', 'error');
        }
    } catch (e) {
        showResultMsg('网络错误', 'error');
    }
}

// ====== 加载全部秒杀结果 ======
async function loadResults() {
    const area = document.getElementById('result-area');
    area.innerHTML = '<div class="msg info">加载中...</div>';

    try {
        const resp = await fetch(`${BASE}/seckill/seckillResult`, {
            headers: { 'Authorization': 'Bearer ' + TOKEN }
        });
        const json = await resp.json();
        if (json.code !== 200 || !json.data || json.data.length === 0) {
            area.innerHTML = '<div class="msg error">' + (json.message || '当前还没有秒杀订单') + '</div>';
            return;
        }

        const stateMap = { 1000: ['未支付', 'tag-unpay'], 1001: ['已取消', 'tag-cancel'], 1002: ['已支付', 'tag-paid'], 1003: ['已退款', 'tag-refund'] };

        area.innerHTML = json.data.map(r => {
            const [stateText, tagClass] = stateMap[r.state] || ['未知', ''];
            let buttons = '';
            if (r.state === 1000) {
                buttons = `<button class="btn btn-success" onclick="doPay(${r.orderId})">💰 去支付</button>
                           <button class="btn btn-warning" onclick="doCancel(${r.orderId})">❌ 取消支付</button>`;
            } else if (r.state === 1002) {
                buttons = `<button class="btn btn-warning" onclick="doRefund(${r.orderId})">↩️ 退款</button>`;
            }
            return `
                <div class="result-card">
                    <div><strong>订单号：</strong>${r.orderId} &nbsp; <strong>商品ID：</strong>${r.seckillId}</div>
                    <div><strong>状态：</strong><span class="tag ${tagClass}">${stateText}</span></div>
                    <div><strong>下单时间：</strong>${formatTime(r.createTime)}</div>
                    <div style="margin-top:10px;">${buttons}</div>
                </div>
            `;
        }).join('');
    } catch (e) {
        area.innerHTML = '<div class="msg error">查询失败</div>';
    }
}

// ====== 支付 / 取消 / 退款 ======
async function doPay(orderId) {
    try {
        const resp = await fetch(`${BASE}/pay/${orderId}`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + TOKEN }
        });
        const html = await resp.text();
        const win = window.open('', '_blank');
        win.document.write(html);
        win.document.close();
    } catch (e) {
        showResultMsg('支付请求失败', 'error');
    }
}

async function doCancel(orderId) {
    if (!confirm('确定要取消这个订单吗？')) return;
    try {
        const resp = await fetch(`${BASE}/pay/cancel/${orderId}`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + TOKEN }
        });
        const json = await resp.json();
        showResultMsg(json.message, json.code === 200 ? 'success' : 'error');
        if (json.code === 200) loadResults();
    } catch (e) {
        showResultMsg('取消失败', 'error');
    }
}

async function doRefund(orderId) {
    if (!confirm('确定要退款吗？')) return;
    try {
        const resp = await fetch(`${BASE}/pay/refund/${orderId}`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + TOKEN }
        });
        const json = await resp.json();
        showResultMsg(json.message, json.code === 200 ? 'success' : 'error');
        if (json.code === 200) loadResults();
    } catch (e) {
        showResultMsg('退款失败', 'error');
    }
}

function showResultMsg(text, type) {
    document.getElementById('result-area').innerHTML = `<div class="msg ${type}">${text}</div>`;
}

function formatTime(t) {
    if (!t) return '-';
    return new Date(t).toLocaleString('zh-CN');
}

// 页面加载
loadProducts();
loadResults();
</script>
</body>
</html>
