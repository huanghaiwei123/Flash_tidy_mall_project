spring:
  datasource:
   url: jdbc:mysql://localhost:3306/seckill_project?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
   username: root
   password: 123456
   driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    # Redis服务器地址
    host: 192.168.147.131
    # Redis服务器端口
    port: 6379
    # Redis数据库索引（默认为0）
    database: 0
    # 连接超时时间（毫秒）
    timeout: 10000ms
    # 连接池配置
    lettuce:
      pool:
        # 最大连接数（负值表示没有限制）
        max-active: 8
        # 最大阻塞等待时间（负值表示没有限制）
        max-wait: -1ms
        # 最大空闲连接
        max-idle: 8
        # 最小空闲连接
        min-idle: 0

jwt:
  secret: gdou-seckill-project-jwt-secret-key-2026 #秘钥，长度至少32位
  expiration:  3600000 #token过期时间，设置为60分钟