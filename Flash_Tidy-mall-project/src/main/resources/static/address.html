<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收货地址 - 潮汐商城</title>
<link rel="stylesheet" href="http://localhost:8080/css/style.css">
<link rel="icon" type="image/png" href="http://localhost:8080/img/logo.png">
</head>
<body data-auth="true">
<div id="navbar"></div>
<div class="container">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2>📍 收货地址</h2>
      <button class="btn btn-primary" onclick="showAddForm()">+ 新增地址</button>
    </div>
    <div id="addrList"><div class="loading"><span class="spinner"></span>加载中...</div></div>
  </div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal" id="addrModal" style="display:none;">
  <div class="modal-overlay" onclick="closeModal()"></div>
  <div class="modal-box">
    <h3 id="addrModalTitle">新增收货地址</h3>
    <form id="addrForm">
      <input type="hidden" id="editAddrId">
      <div class="form-group">
        <label>收件人姓名 *</label>
        <input type="text" id="receiverName" placeholder="请输入收件人姓名" required>
      </div>
      <div class="form-group">
        <label>手机号 *</label>
        <input type="text" id="phone" placeholder="请输入手机号" maxlength="11" required>
      </div>
      <div class="form-group">
        <label>省份 *</label>
        <select id="province" onchange="onProvinceChange()"><option value="">请选择省份</option></select>
      </div>
      <div class="form-group">
        <label>城市 *</label>
        <select id="city" onchange="onCityChange()" disabled><option value="">请选择城市</option></select>
      </div>
      <div class="form-group">
        <label>区/县 *</label>
        <select id="district" disabled><option value="">请选择区/县</option></select>
      </div>
      <div class="form-group">
        <label>详细地址 *</label>
        <input type="text" id="detail" placeholder="街道、门牌号等" required>
      </div>
      <div class="form-group">
        <label class="check-line"><input type="checkbox" id="isDefault" value="1"> 设为默认地址</label>
      </div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn" onclick="closeModal()">取消</button>
        <button type="submit" class="btn btn-primary">保 存</button>
      </div>
    </form>
  </div>
</div>

<script src="http://localhost:8080/js/api.js"></script>
<script src="http://localhost:8080/js/common.js"></script>
<script src="http://localhost:8080/js/city-data.js"></script>
<script>
var addresses = [];

// ==================== 省市区三级联动 ====================
function fillProvince() {
  var sel = document.getElementById('province');
  sel.innerHTML = '<option value="">请选择省份</option>';
  Object.keys(CITY_DATA).forEach(function(p) {
    sel.innerHTML += '<option value="' + esc(p) + '">' + esc(p) + '</option>';
  });
}

function onProvinceChange() {
  var p = document.getElementById('province').value;
  var citySel = document.getElementById('city');
  var distSel = document.getElementById('district');
  citySel.innerHTML = '<option value="">请选择城市</option>';
  distSel.innerHTML = '<option value="">请选择区/县</option>';
  citySel.disabled = !p;
  distSel.disabled = true;
  if (!p) return;
  Object.keys(CITY_DATA[p] || {}).forEach(function(c) {
    citySel.innerHTML += '<option value="' + esc(c) + '">' + esc(c) + '</option>';
  });
}

function onCityChange() {
  var p = document.getElementById('province').value;
  var c = document.getElementById('city').value;
  var distSel = document.getElementById('district');
  distSel.innerHTML = '<option value="">请选择区/县</option>';
  distSel.disabled = !c;
  if (!c) return;
  (CITY_DATA[p] && CITY_DATA[p][c] || []).forEach(function(d) {
    distSel.innerHTML += '<option value="' + esc(d) + '">' + esc(d) + '</option>';
  });
}

fillProvince();

async function loadAddresses() {
  var res = await get('/address/query');
  if (!res || res.code !== 200) { document.getElementById('addrList').innerHTML = '<div class="loading">加载失败</div>'; return; }
  addresses = res.data || [];
  if (!addresses.length) { document.getElementById('addrList').innerHTML = '<div class="loading">暂无收货地址，点击上方按钮添加</div>'; return; }
  renderAddresses();
}

function renderAddresses() {
  var html = '';
  addresses.forEach(function(addr) {
    html +=
      '<div class="address-card' + (addr.isDefault === 1 ? ' default' : '') + '">' +
      '  <div class="addr-header">' +
      '    <strong>' + esc(addr.receiverName) + '</strong> &nbsp; ' + esc(addr.phone) +
      (addr.isDefault === 1 ? ' <span class="badge badge-primary" style="margin-left:8px;">默认</span>' : '') +
      '  </div>' +
      '  <div class="addr-body">' +
      esc(addr.province || '') + ' ' + esc(addr.city || '') + ' ' + esc(addr.district || '') + ' ' + esc(addr.detail || '') +
      '  </div>' +
      '  <div class="addr-footer">' +
      '    <label class="addr-default-check" title="默认地址只能有一个">' +
      '      <input type="checkbox" ' + (addr.isDefault === 1 ? 'checked' : '') + ' onchange="setDefault(' + addr.id + ', this.checked)"> 设为默认地址' +
      '    </label>' +
      '    <div class="addr-actions">' +
      '      <button class="btn btn-sm" onclick="editAddr(' + addr.id + ')">编辑</button>' +
      '      <button class="btn btn-sm btn-danger" onclick="deleteAddr(' + addr.id + ')">删除</button>' +
      '    </div>' +
      '  </div>' +
      '</div>';
  });
  document.getElementById('addrList').innerHTML = html;
}

// ==================== 编辑地址 ====================
function editAddr(id) {
  var addr = addresses.find(function(a) { return a.id === id; });
  if (!addr) return;
  document.getElementById('addrModalTitle').textContent = '编辑收货地址';
  document.getElementById('editAddrId').value = addr.id;
  document.getElementById('receiverName').value = addr.receiverName || '';
  document.getElementById('phone').value = addr.phone || '';
  document.getElementById('detail').value = addr.detail || '';
  document.getElementById('isDefault').checked = addr.isDefault === 1;
  // 回填省市区三级下拉
  var pSel = document.getElementById('province');
  pSel.value = addr.province || '';
  onProvinceChange();
  var cSel = document.getElementById('city');
  cSel.value = addr.city || '';
  onCityChange();
  var dSel = document.getElementById('district');
  dSel.value = addr.district || '';
  document.getElementById('addrModal').style.display = 'flex';
}

// ==================== 设置/取消默认地址 ====================
async function setDefault(id, checked) {
  var res = await post('/address/update/' + id, { isDefault: checked ? 1 : 0 });
  if (!res) return;
  if (res.code === 200) {
    toast(checked ? '已设为默认地址' : '已取消默认地址');
    loadAddresses();
  } else {
    toast(res.msg || '操作失败', 'error');
    loadAddresses();
  }
}

function showAddForm() {
  document.getElementById('addrForm').reset();
  document.getElementById('addrModalTitle').textContent = '新增收货地址';
  document.getElementById('editAddrId').value = '';
  // 重置三级联动下拉
  fillProvince();
  var cSel = document.getElementById('city');
  cSel.innerHTML = '<option value="">请选择城市</option>';
  cSel.disabled = true;
  var dSel = document.getElementById('district');
  dSel.innerHTML = '<option value="">请选择区/县</option>';
  dSel.disabled = true;
  document.getElementById('addrModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('addrModal').style.display = 'none';
}

document.getElementById('addrForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var dto = {
    receiverName: document.getElementById('receiverName').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    province: document.getElementById('province').value.trim(),
    city: document.getElementById('city').value.trim(),
    district: document.getElementById('district').value.trim(),
    detail: document.getElementById('detail').value.trim(),
    isDefault: document.getElementById('isDefault').checked ? 1 : 0
  };
  if (!dto.receiverName || !dto.phone || !dto.detail) { toast('请填写必填项', 'error'); return; }
  if (!dto.province || !dto.city || !dto.district) { toast('请选择省份、城市和区县', 'error'); return; }
  if (!/^1[3-9]\d{9}$/.test(dto.phone)) { toast('手机号格式不正确', 'error'); return; }
  var editId = document.getElementById('editAddrId').value;
  var res;
  if (editId) {
    dto.isDefault = document.getElementById('isDefault').checked ? 1 : 0;
    res = await post('/address/update/' + editId, dto);
  } else {
    res = await post('/address/insert', dto);
  }
  if (!res) return;
  if (res.code === 200) {
    toast(editId ? '地址修改成功' : '地址添加成功');
    closeModal();
    loadAddresses();
  } else {
    toast(res.msg || (editId ? '修改失败' : '添加失败'), 'error');
  }
});

async function deleteAddr(id) {
  if (!confirm('确认删除该地址？')) return;
  var res = await post('/address/delete/' + id);
  if (!res) return;
  if (res.code === 200) {
    toast('已删除');
    loadAddresses();
  } else {
    toast(res.msg || '删除失败', 'error');
  }
}

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

loadAddresses();
</script>
</body>
</html>
