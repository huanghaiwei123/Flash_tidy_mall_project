<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店铺 - 潮汐商城</title>
<link rel="stylesheet" href="http://localhost:8080/css/style.css">
<link rel="icon" type="image/png" href="http://localhost:8080/img/logo.png">
<style>
  .shop-header { display:flex; align-items:center; gap:20px; margin-bottom:24px; padding:24px; background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .shop-logo { width:80px; height:80px; border-radius:8px; object-fit:cover; background:#f0f0f0; }
  .shop-info h2 { margin:0 0 8px 0; }
  .shop-info p { margin:0; color:#666; font-size:14px; }
  .goods-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px; }
  .goods-card { background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); cursor:pointer; transition:box-shadow .2s; }
  .goods-card:hover { box-shadow:0 2px 12px rgba(0,0,0,.15); }
  .goods-card img { width:100%; height:180px; object-fit:cover; }
  .goods-card .info { padding:12px; }
  .goods-card .name { font-size:15px; font-weight:500; margin-bottom:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .goods-card .price { color:#e4393c; font-size:18px; font-weight:bold; }
  .goods-card .sales { color:#999; font-size:12px; }
  .pagination { display:flex; justify-content:center; gap:8px; margin-top:24px; }
  .pagination button { padding:6px 14px; border:1px solid #ddd; background:#fff; border-radius:4px; cursor:pointer; }
  .pagination button.active { background:#e4393c; color:#fff; border-color:#e4393c; }
  .pagination button:disabled { opacity:.4; cursor:not-allowed; }
  .empty { text-align:center; padding:60px 0; color:#999; }
</style>
</head>
<body>
<div id="navbar"></div>
<div class="container" id="shopContainer">
  <div class="loading"><span class="spinner"></span>加载中...</div>
</div>
<script src="http://localhost:8080/js/api.js"></script>
<script src="http://localhost:8080/js/common.js"></script>
<script>
var merchantId = new URLSearchParams(window.location.search).get('id');
var currentPage = 1;
var totalPages = 1;

async function loadShop(page) {
  page = page || 1;
  currentPage = page;
  var container = document.getElementById('shopContainer');
  container.innerHTML = '<div class="loading"><span class="spinner"></span>加载中...</div>';

  var res = await get('/goods/shop/' + merchantId + '?page=' + page + '&size=12');
  if (!res || res.code !== 200) {
    container.innerHTML = '<div class="empty">' + (res && res.msg || '店铺不存在') + '</div>';
    return;
  }
  var data = res.data;
  var shop = data.shop;
  var records = data.records || [];
  totalPages = Math.ceil(data.total / data.size) || 1;

  var goodsHtml = '';
  if (!records.length) {
    goodsHtml = '<div class="empty">店铺暂无商品</div>';
  } else {
    goodsHtml = '<div class="goods-grid">';
    records.forEach(function(spu) {
      goodsHtml +=
        '<div class="goods-card" onclick="location.href=\'goods-detail.html?id=' + spu.id + '\'">' +
        '  <img src="' + esc(spu.mainImage || '') + '" alt="' + esc(spu.name) + '" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22220%22 height=%22180%22><rect fill=%22%23eee%22 width=%22220%22 height=%22180%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23ccc%22>暂无图片</text></svg>\'">' +
        '  <div class="info">' +
        '    <div class="name" title="' + esc(spu.name) + '">' + esc(spu.name) + '</div>' +
        '    <div class="price">¥' + (spu.minPrice || '--') + '</div>' +
        '    <div class="sales">已售 ' + (spu.sales || 0) + ' 件</div>' +
        '  </div>' +
        '</div>';
    });
    goodsHtml += '</div>';
  }

  var pageHtml = '';
  if (totalPages > 1) {
    pageHtml = '<div class="pagination">';
    pageHtml += '<button onclick="loadShop(' + (currentPage - 1) + ')" ' + (currentPage <= 1 ? 'disabled' : '') + '>上一页</button>';
    for (var i = 1; i <= totalPages; i++) {
      pageHtml += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="loadShop(' + i + ')">' + i + '</button>';
    }
    pageHtml += '<button onclick="loadShop(' + (currentPage + 1) + ')" ' + (currentPage >= totalPages ? 'disabled' : '') + '>下一页</button>';
    pageHtml += '</div>';
  }

  container.innerHTML =
    '<div class="shop-header">' +
    '  <img class="shop-logo" src="' + esc(shop.shopLogo || '') + '" alt="' + esc(shop.shopName) + '" onerror="this.style.display=\'none\'">' +
    '  <div class="shop-info">' +
    '    <h2>🏪 ' + esc(shop.shopName) + '</h2>' +
    (shop.shopDescription ? '<p>' + esc(shop.shopDescription) + '</p>' : '') +
    '    <p style="color:#999;font-size:12px;">共 ' + data.total + ' 件商品</p>' +
    '  </div>' +
    '</div>' +
    goodsHtml +
    pageHtml;
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

if (!merchantId) {
  document.getElementById('shopContainer').innerHTML = '<div class="empty">店铺ID不存在</div>';
} else {
  loadShop();
}
</script>
</body>
</html>
