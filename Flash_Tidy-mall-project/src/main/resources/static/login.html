<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 潮汐商城</title>
<link rel="stylesheet" href="http://localhost:8080/css/style.css">
<link rel="icon" type="image/png" href="http://localhost:8080/img/logo.png">
</head>
<body>
<div class="auth-page">
  <div class="card auth-card">
    <h1><span class="icon">🌊</span> 潮汐商城</h1>
    <p class="subtitle">欢迎回来，请登录您的账号</p>
    <form id="loginForm">
      <div class="form-group">
        <label>手机号</label>
        <input type="text" id="phone" placeholder="请输入手机号" maxlength="11" required>
        <div class="err-msg" id="phoneErr"></div>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" required>
        <div class="err-msg" id="passwordErr"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <div class="form-footer">还没有账号？<a href="http://localhost:8080/register.html">立即注册</a></div>
  </div>
</div>
<script src="http://localhost:8080/js/api.js"></script>
<script src="http://localhost:8080/js/common.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var phone = document.getElementById('phone').value.trim();
  var pwd = document.getElementById('password').value;
  if (!phone) { toast('请输入手机号', 'error'); return; }
  if (!pwd) { toast('请输入密码', 'error'); return; }
  var res = await post('/login', { phone: phone, password: pwd });
  if (!res) return;
  if (res.code === 200) {
    localStorage.setItem('token', res.data.token);
    // 将用户信息存入 localStorage，供各页面直接使用，免去每次查库
    var userInfo = {
      nickname: res.data.nickname || '',
      phone: res.data.phone || '',
      email: res.data.email || '',
      avatar: res.data.avatar || '',
      gender: res.data.gender || 0
    };
    localStorage.setItem('userInfo', JSON.stringify(userInfo));
    toast('登录成功');
    setTimeout(function() { window.location.href = 'http://localhost:8080/index.html'; }, 800);
  } else {
    toast(res.msg || '登录失败', 'error');
  }
});
</script>
</body>
</html>
