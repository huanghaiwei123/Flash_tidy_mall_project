<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家中心 - 潮汐商城</title>
<link rel="stylesheet" href="http://localhost:8080/css/style.css">
<link rel="icon" type="image/png" href="http://localhost:8080/img/logo.png">
<!-- Quill 富文本编辑器 -->
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<style>.ql-editor { min-height:200px; }</style>
</head>
<body data-auth="true">
<div id="navbar"></div>
<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <h1 style="margin:0;">🏪 商家中心</h1>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-sm btn-accent" onclick="goMyShop()">🏪 进入我的店铺</button>
      <button class="btn btn-sm" onclick="switchToUser()">🔄 切换回普通用户</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('spu')">📦 商品管理 (SPU)</button>
    <button class="tab" onclick="switchTab('sku')">📋 规格管理 (SKU)</button>
            <button class="tab" onclick="switchTab('seckill')">⚡ 秒杀活动</button>
    <button class="tab" onclick="switchTab('orders')">📑 订单管理</button>
    <button class="tab" onclick="switchTab('comments')">💬 商品评论</button>
  </div>

  <!-- ==================== SPU 管理 ==================== -->
  <div class="tab-panel" id="panel-spu">
    <div style="margin-bottom:16px;display:flex;gap:8px;">
      <button class="btn btn-primary" onclick="showSpuForm()">+ 添加商品</button>
      <button class="btn" onclick="loadSpuList()">🔄 刷新</button>
    </div>
    <div id="spuList"><div class="loading"><span class="spinner"></span>加载中...</div></div>
  </div>

  <!-- ==================== SKU 管理 ==================== -->
  <div class="tab-panel" id="panel-sku" style="display:none;">
    <div style="margin-bottom:16px;">
      <label>选择 SPU：</label>
      <select id="skuSpuSelect" onchange="onSpuSelect()" style="width:300px;">
        <option value="">-- 请选择商品 --</option>
      </select>
      <button class="btn btn-primary" onclick="showSkuForm()" style="margin-left:8px;" disabled id="addSkuBtn">+ 添加规格</button>
    </div>
    <div id="skuList"><div class="loading">请先选择一个商品</div></div>
  </div>

  <!-- ==================== 秒杀活动 ==================== -->
  <div class="tab-panel" id="panel-seckill" style="display:none;">
    <div style="margin-bottom:16px;display:flex;gap:8px;">
      <button class="btn btn-primary" onclick="goCreateSeckill()">+ 创建秒杀活动</button>
      <button class="btn" onclick="loadMerchantSeckill()">🔄 刷新</button>
      <span style="line-height:32px;color:#999;font-size:13px;">需先在"规格管理"中为 SKU 设置秒杀信息</span>
    </div>
    <div id="merchantSeckill"><div class="loading">点击上方标签加载</div></div>
  </div>

  <!-- ==================== 订单管理 ==================== -->
  <div class="tab-panel" id="panel-orders" style="display:none;">
    <div id="merchantOrders"><div class="loading">点击上方标签加载</div></div>
  </div>

  <!-- ==================== 商品评论 ==================== -->
  <div class="tab-panel" id="panel-comments" style="display:none;">
    <div id="merchantComments"><div class="loading">点击上方标签加载</div></div>
  </div>
</div>

<!-- SPU 弹窗 -->
<div class="modal" id="spuModal" style="display:none;">
  <div class="modal-overlay" onclick="closeSpuModal()"></div>
  <div class="modal-box" style="max-width:600px;">
    <h3 id="spuModalTitle">添加商品</h3>
    <form id="spuForm">
      <div class="form-group"><label>商品名称 *</label><input type="text" id="spuName" required></div>
      <div class="form-group"><label>描述</label><textarea id="spuDesc" rows="2"></textarea></div>
      <div class="form-group"><label>商品分类 *</label><select id="spuCategory" required><option value="">-- 请选择分类 --</option></select></div>
      <div class="form-group"><label>品牌</label><input type="text" id="spuBrand"></div>
      <div class="form-group"><label>主图URL</label><input type="text" id="spuImage"></div>
      <div class="form-group"><label>商品详情</label><div id="quillEditor"></div><input type="hidden" id="spuDetail"></div>
      <input type="hidden" id="spuEditId">
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn" onclick="closeSpuModal()">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- SKU 弹窗 -->
<div class="modal" id="skuModal" style="display:none;">
  <div class="modal-overlay" onclick="closeSkuModal()"></div>
  <div class="modal-box" style="max-width:600px;">
    <h3 id="skuModalTitle">添加规格</h3>
    <form id="skuForm">
      <div class="form-group"><label>规格名称 *</label><input type="text" id="skuName" required></div>
      <div class="form-group"><label>规格描述</label><input type="text" id="skuSpec" placeholder="如：黑色 / 128GB"></div>
      <div class="form-row">
        <div class="form-group"><label>价格 *</label><input type="number" id="skuPrice" step="0.01" required></div>
        <div class="form-group"><label>原价</label><input type="number" id="skuOrigPrice" step="0.01"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>库存 *</label><input type="number" id="skuStock" required></div>
        <div class="form-group"><label>活动库存</label><input type="number" id="skuPromStock" value="0"></div>
      </div>
      <div class="form-group"><label>图片URL</label><input type="text" id="skuImage"></div>
      <div class="form-row">
        <div class="form-group"><label>排序</label><input type="number" id="skuSort" value="0"></div>
        <div class="form-group"><label>状态</label>
          <select id="skuStatus"><option value="1">上架</option><option value="0">下架</option></select>
        </div>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="skuSeckill"> 参与秒杀</label>
      </div>
      <div id="seckillFields" style="display:none;">
        <div class="form-row">
          <div class="form-group"><label>秒杀价</label><input type="number" id="skuSeckillPrice" step="0.01"></div>
          <div class="form-group"><label>秒杀开始</label><input type="datetime-local" id="skuSeckillStart"></div>
          <div class="form-group"><label>秒杀结束</label><input type="datetime-local" id="skuSeckillEnd"></div>
        </div>
      </div>
      <input type="hidden" id="skuEditId">
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn" onclick="closeSkuModal()">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="http://localhost:8080/js/api.js"></script>
<script src="http://localhost:8080/js/common.js"></script>
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script>
// ==================== Quill 编辑器 ====================
var quill;
function initQuill() {
  if (quill) return;
  quill = new Quill('#quillEditor', {
    theme: 'snow',
    placeholder: '输入商品详情...',
    modules: {
      toolbar: [
        [{ 'header': [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'color': [] }, { 'background': [] }],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        [{ 'align': [] }],
        ['blockquote', 'code-block'],
        ['link', 'image'],
        ['clean']
      ]
    }
  });
}

function setQuillContent(html) { initQuill(); quill.root.innerHTML = html || ''; }
function getQuillContent() { return quill ? quill.root.innerHTML : ''; }

// ==================== Tab 切换 ====================
function switchTab(name) {
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.style.display = 'none'; });
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('panel-' + name).style.display = 'block';
  // 高亮对应的 tab 按钮
  var tabs = document.querySelectorAll('.tab');
  var tabMap = { spu: 0, sku: 1, seckill: 2, orders: 3, comments: 4 };
  if (tabs[tabMap[name]]) tabs[tabMap[name]].classList.add('active');
  if (name === 'spu' && !window._spuLoaded) { window._spuLoaded = true; loadSpuList(); }
  if (name === 'sku' && !window._skuLoaded) { window._skuLoaded = true; loadSpuOptions(); }
  if (name === 'seckill' && !window._seckillLoaded) { window._seckillLoaded = true; loadMerchantSeckill(); }
  if (name === 'orders' && !window._ordersLoaded) { window._ordersLoaded = true; loadMerchantOrders(); }
  if (name === 'comments' && !window._commentsLoaded) { window._commentsLoaded = true; loadMerchantComments(); }
}

// ==================== SPU ====================
var spuList = [];

async function loadSpuList() {
  var container = document.getElementById('spuList');
  container.innerHTML = '<div class="loading"><span class="spinner"></span>加载中...</div>';
  // 商家 SPU 列表需要 merchantId 参数，从登录用户获取。这里用简单方式：先尝试不带参数
  var res = await get('/merchant/spu/query');
  if (!res || res.code !== 200) { container.innerHTML = '<div class="loading">加载失败：' + (res && res.msg || '') + '</div>'; return; }
  spuList = res.data || [];
  if (!spuList.length) { container.innerHTML = '<div class="loading">暂无商品，点击上方按钮添加</div>'; return; }
  var html = '<table class="table"><thead><tr><th>ID</th><th>名称</th><th>分类</th><th>品牌</th><th>销量</th><th>状态</th><th>操作</th></tr></thead><tbody>';
  spuList.forEach(function(spu) {
    html += '<tr>' +
      '<td>' + spu.id + '</td>' +
      '<td>' + esc(spu.name) + '</td>' +
      '<td>' + esc(spu.categoryName || '') + '</td>' +
      '<td>' + esc(spu.brand || '') + '</td>' +
      '<td>' + (spu.sales || 0) + '</td>' +
      '<td><span class="badge ' + (spu.status === 1 ? 'badge-success' : 'badge-default') + '">' + (spu.status === 1 ? '上架' : '下架') + '</span></td>' +
      '<td>' +
      '  <button class="btn btn-sm" onclick="editSpu(' + spu.id + ')">编辑</button>' +
      '  <button class="btn btn-sm ' + (spu.status === 1 ? 'btn-danger' : 'btn-success') + '" onclick="toggleSpu(' + spu.id + ',' + spu.status + ')">' + (spu.status === 1 ? '下架' : '上架') + '</button>' +
      '</td></tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function showSpuForm() {
  document.getElementById('spuModalTitle').textContent = '添加商品';
  document.getElementById('spuForm').reset();
  document.getElementById('spuEditId').value = '';
  document.getElementById('spuModal').style.display = 'flex';
  setQuillContent('');
}

function editSpu(id) {
  var spu = spuList.find(function(s) { return s.id === id; });
  if (!spu) return;
  document.getElementById('spuModalTitle').textContent = '编辑商品';
  document.getElementById('spuName').value = spu.name || '';
  document.getElementById('spuDesc').value = spu.description || '';
  document.getElementById('spuCategory').value = spu.categoryId || '';
  document.getElementById('spuBrand').value = spu.brand || '';
  document.getElementById('spuImage').value = spu.mainImage || '';
  setQuillContent(spu.detail || '');
  document.getElementById('spuEditId').value = spu.id;
  document.getElementById('spuModal').style.display = 'flex';
}

function closeSpuModal() { document.getElementById('spuModal').style.display = 'none'; }

document.getElementById('spuForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var dto = {
    name: document.getElementById('spuName').value.trim(),
    description: document.getElementById('spuDesc').value.trim(),
    categoryId: parseInt(document.getElementById('spuCategory').value) || undefined,
    brand: document.getElementById('spuBrand').value.trim(),
    mainImage: document.getElementById('spuImage').value.trim(),
    detail: getQuillContent()
  };
  var editId = document.getElementById('spuEditId').value;
  var res;
  if (editId) {
    res = await put('/merchant/spu/' + editId, dto);
  } else {
    res = await post('/merchant/spu', dto);
  }
  if (!res) return;
  if (res.code === 200) {
    toast(editId ? '商品已更新' : '商品已添加');
    closeSpuModal();
    loadSpuList();
  } else {
    toast(res.msg || '操作失败', 'error');
  }
});

async function toggleSpu(id, curStatus) {
  var newStatus = curStatus === 1 ? 0 : 1;
  var res = await put('/merchant/spu/' + id + '/status?status=' + newStatus);
  if (!res) return;
  if (res.code === 200) { toast(newStatus === 1 ? '已上架' : '已下架'); loadSpuList(); }
  else { toast(res.msg || '操作失败', 'error'); }
}

// ==================== SKU ====================
var skuSpuId = null;

async function loadSpuOptions() {
  var sel = document.getElementById('skuSpuSelect');
  // 重新加载 SPU 列表来填充下拉
  var res = await get('/merchant/spu/query');
  if (!res || res.code !== 200) return;
  var list = res.data || [];
  sel.innerHTML = '<option value="">-- 请选择商品 --</option>';
  list.forEach(function(spu) {
    sel.innerHTML += '<option value="' + spu.id + '">' + esc(spu.name) + ' (ID:' + spu.id + ')</option>';
  });
}

function onSpuSelect() {
  skuSpuId = document.getElementById('skuSpuSelect').value;
  document.getElementById('addSkuBtn').disabled = !skuSpuId;
  if (skuSpuId) loadSkuList();
  else document.getElementById('skuList').innerHTML = '<div class="loading">请先选择一个商品</div>';
}

async function loadSkuList() {
  if (!skuSpuId) return;
  var container = document.getElementById('skuList');
  container.innerHTML = '<div class="loading"><span class="spinner"></span>加载中...</div>';
  var res = await get('/sku/spu/' + skuSpuId);
  if (!res || res.code !== 200) { container.innerHTML = '<div class="loading">加载失败</div>'; return; }
  var list = res.data || [];
  if (!list.length) { container.innerHTML = '<div class="loading">暂无规格，点击上方按钮添加</div>'; return; }
  var html = '<table class="table"><thead><tr><th>ID</th><th>名称</th><th>规格</th><th>价格</th><th>库存</th><th>秒杀</th><th>状态</th><th>操作</th></tr></thead><tbody>';
  list.forEach(function(sku) {
    html += '<tr>' +
      '<td>' + sku.id + '</td>' +
      '<td>' + esc(sku.name) + '</td>' +
      '<td>' + esc(sku.spec || '') + '</td>' +
      '<td>¥' + (sku.price || 0) + '</td>' +
      '<td>' + (sku.stock || 0) + '</td>' +
      '<td>' + (sku.isSeckill === 1 ? '⚡ ¥' + (sku.seckillPrice || 0) + '<br><small>' + (sku.seckillStartTime || '').substring(0, 10) + '</small>' : '—') + '</td>' +
      '<td><span class="badge ' + (sku.status === 1 ? 'badge-success' : 'badge-default') + '">' + (sku.status === 1 ? '上架' : '下架') + '</span></td>' +
      '<td>' +
      '  <button class="btn btn-sm" onclick="editSku(' + sku.id + ')">编辑</button>' +
      '  <button class="btn btn-sm btn-danger" onclick="deleteSku(' + sku.id + ')">删除</button>' +
      '  <button class="btn btn-sm" onclick="toggleSku(' + sku.id + ',' + sku.status + ')">' + (sku.status === 1 ? '下架' : '上架') + '</button>' +
      '</td></tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function showSkuForm() {
  if (!skuSpuId) return;
  document.getElementById('skuModalTitle').textContent = '添加规格';
  document.getElementById('skuForm').reset();
  document.getElementById('skuEditId').value = '';
  document.getElementById('skuModal').style.display = 'flex';
}

async function editSku(id) {
  var res = await get('/sku/' + id);
  if (!res || res.code !== 200) { toast('获取SKU详情失败', 'error'); return; }
  var sku = res.data;
  document.getElementById('skuModalTitle').textContent = '编辑规格';
  document.getElementById('skuName').value = sku.name || '';
  document.getElementById('skuSpec').value = sku.spec || '';
  document.getElementById('skuPrice').value = sku.price || '';
  document.getElementById('skuOrigPrice').value = sku.originalPrice || '';
  document.getElementById('skuStock').value = sku.stock || 0;
  document.getElementById('skuPromStock').value = sku.promotionStock || 0;
  document.getElementById('skuImage').value = sku.image || '';
  document.getElementById('skuSort').value = sku.sort || 0;
  document.getElementById('skuStatus').value = sku.status || 1;
  document.getElementById('skuSeckill').checked = sku.isSeckill === 1;
  document.getElementById('seckillFields').style.display = sku.isSeckill === 1 ? 'block' : 'none';
  if (sku.isSeckill === 1) {
    document.getElementById('skuSeckillPrice').value = sku.seckillPrice || '';
    document.getElementById('skuSeckillStart').value = sku.seckillStartTime ? sku.seckillStartTime.substring(0, 16) : '';
    document.getElementById('skuSeckillEnd').value = sku.seckillEndTime ? sku.seckillEndTime.substring(0, 16) : '';
  }
  document.getElementById('skuEditId').value = sku.id;
  document.getElementById('skuModal').style.display = 'flex';
}

function closeSkuModal() { document.getElementById('skuModal').style.display = 'none'; }

document.getElementById('skuSeckill').addEventListener('change', function() {
  document.getElementById('seckillFields').style.display = this.checked ? 'block' : 'none';
});

document.getElementById('skuForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var dto = {
    spuId: parseInt(skuSpuId),
    name: document.getElementById('skuName').value.trim(),
    spec: document.getElementById('skuSpec').value.trim(),
    price: parseFloat(document.getElementById('skuPrice').value) || 0,
    originalPrice: parseFloat(document.getElementById('skuOrigPrice').value) || null,
    image: document.getElementById('skuImage').value.trim() || null,
    stock: parseInt(document.getElementById('skuStock').value) || 0,
    promotionStock: parseInt(document.getElementById('skuPromStock').value) || 0,
    sort: parseInt(document.getElementById('skuSort').value) || 0,
    status: parseInt(document.getElementById('skuStatus').value),
    isSeckill: document.getElementById('skuSeckill').checked ? 1 : 0
  };
  if (dto.isSeckill === 1) {
    dto.seckillPrice = parseFloat(document.getElementById('skuSeckillPrice').value) || 0;
    dto.seckillStartTime = document.getElementById('skuSeckillStart').value ? document.getElementById('skuSeckillStart').value + ':00' : null;
    dto.seckillEndTime = document.getElementById('skuSeckillEnd').value ? document.getElementById('skuSeckillEnd').value + ':00' : null;
  }
  var editId = document.getElementById('skuEditId').value;
  var res;
  if (editId) {
    res = await put('/sku/' + editId, dto);
  } else {
    res = await post('/sku', dto);
  }
  if (!res) return;
  if (res.code === 200) {
    toast(editId ? '规格已更新' : '规格已添加');
    closeSkuModal();
    loadSkuList();
  } else {
    toast(res.msg || '操作失败', 'error');
  }
});

async function deleteSku(id) {
  if (!confirm('确认删除该规格？')) return;
  var res = await del('/sku/' + id);
  if (!res) return;
  if (res.code === 200) { toast('已删除'); loadSkuList(); }
  else { toast(res.msg || '删除失败', 'error'); }
}

async function toggleSku(id, curStatus) {
  var newStatus = curStatus === 1 ? 0 : 1;
  var res = await put('/sku/' + id + '/status?status=' + newStatus);
  if (!res) return;
  if (res.code === 200) { toast(newStatus === 1 ? '已上架' : '已下架'); loadSkuList(); }
  else { toast(res.msg || '操作失败', 'error'); }
}

// ==================== 秒杀活动 ====================
function goCreateSeckill() {
  // 切换到规格管理 Tab
  switchTab('sku');
  // 高亮提示
  toast('请在规格管理中编辑 SKU，勾选"参与秒杀"并设置秒杀信息', 'warning');
}
async function loadMerchantSeckill() {
  var container = document.getElementById('merchantSeckill');
  container.innerHTML = '<div class="loading"><span class="spinner"></span>加载中...</div>';
  var res = await get('/merchant/seckill/list');
  if (!res || res.code !== 200) { container.innerHTML = '<div class="loading">加载失败</div>'; return; }
  var list = res.data || [];
  if (!list.length) { container.innerHTML = '<div class="loading">暂无秒杀活动<br><small>在"规格管理"中勾选"参与秒杀"即可创建</small></div>'; return; }

  var now = new Date().getTime();
  var html = '<table class="table"><thead><tr><th>SKU ID</th><th>规格名称</th><th>所属商品</th><th>秒杀价</th><th>活动库存(Redis)</th><th>活动时间</th><th>状态</th><th>操作</th></tr></thead><tbody>';
  list.forEach(function(item) {
    var statusIcon = item.seckillStatus === 'ACTIVE' ? '🟢' : item.seckillStatus === 'PENDING' ? '🟡' : '🔴';
    var statusCls = item.seckillStatus === 'ACTIVE' ? 'badge-success' : item.seckillStatus === 'PENDING' ? 'badge-warning' : 'badge-default';
    var stockInfo = item.redisStock + ' / ' + (item.promotionStock || 0) + '（配额）';
    var timeText = (item.seckillStartTime || '').substring(0, 16) + ' ~ ' + (item.seckillEndTime || '').substring(0, 16);
    html += '<tr>' +
      '<td>' + item.skuId + '</td>' +
      '<td>' + esc(item.skuName) + '</td>' +
      '<td>' + esc(item.spuName || '') + '</td>' +
      '<td style="color:#ff4d2e;font-weight:600;">¥' + (item.seckillPrice || 0) + '</td>' +
      '<td>' + stockInfo + '</td>' +
      '<td style="font-size:12px;">' + timeText + '</td>' +
      '<td><span class="badge ' + statusCls + '">' + statusIcon + ' ' + (item.seckillStatusText || '') + '</span></td>' +
      '<td><button class="btn btn-sm" onclick="editSku(' + item.skuId + ')">✏️ 编辑</button></td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

// ==================== 订单 ====================
async function loadMerchantOrders() {
  var container = document.getElementById('merchantOrders');
  container.innerHTML = '<div class="loading"><span class="spinner"></span>加载中...</div>';
  var res = await get('/merchant/order/queryList');
  if (!res || res.code !== 200) { container.innerHTML = '<div class="loading">加载失败</div>'; return; }
  var list = res.data || [];
  if (!list.length) { container.innerHTML = '<div class="loading">暂无订单</div>'; return; }
  var html = '<table class="table"><thead><tr><th>订单号</th><th>类型</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>';
  list.forEach(function(o) {
    var stMap = { 'PENDING_PAY':'待支付','PAID':'已支付','SHIPPED':'已发货','RECEIVED':'已收货','COMPLETED':'已完成','CANCELLED':'已取消','REFUNDING':'退款中','REFUNDED':'已退款' };
    var stCls = o.status === 'PAID' ? 'badge-info' : o.status === 'SHIPPED' ? 'badge-primary' : o.status === 'COMPLETED' ? 'badge-success' : 'badge-default';
    var actions = '';
    if (o.status === 'PAID') {
      actions = '<button class="btn btn-sm btn-primary" onclick="shipOrder(\'' + esc(o.orderNo) + '\')">📦 发货</button>';
    }
    html += '<tr>' +
      '<td title="' + esc(o.orderNo) + '">' + esc(o.orderNo.substring(0, 12)) + '...</td>' +
      '<td>' + (o.orderType === 'SECKILL' ? '⚡秒杀' : '🛒普通') + '</td>' +
      '<td>¥' + (o.payAmount || 0) + '</td>' +
      '<td><span class="badge ' + stCls + '">' + (stMap[o.status] || o.status) + '</span></td>' +
      '<td>' + (o.createTime || '').substring(0, 10) + '</td>' +
      '<td>' + actions + '</td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

async function shipOrder(orderNo) {
  if (!confirm('确认对订单 ' + orderNo.substring(0, 12) + '... 发货？')) return;
  var res = await post('/merchant/order/ship/' + orderNo);
  if (!res) return;
  if (res.code === 200) {
    toast(res.msg || '发货成功');
    loadMerchantOrders();
  } else {
    toast(res.msg || '发货失败', 'error');
  }
}

// ==================== 商品评论 ====================
async function loadMerchantComments() {
  var container = document.getElementById('merchantComments');
  container.innerHTML = '<div class="loading"><span class="spinner"></span>加载中...</div>';
  var res = await get('/merchant/comment/list');
  if (!res || res.code !== 200) { container.innerHTML = '<div class="loading">加载失败：' + (res && res.msg || '') + '</div>'; return; }
  var list = res.data || [];
  if (!list.length) { container.innerHTML = '<div class="loading">暂无评论</div>'; return; }

  var html = '<table class="table"><thead><tr><th>商品</th><th>用户</th><th>评分</th><th>内容</th><th>回复</th><th>操作</th></tr></thead><tbody>';
  list.forEach(function(c) {
    var stars = '';
    for (var i = 1; i <= 5; i++) {
      stars += '<span style="color:' + (i <= (c.rating || 0) ? '#ff9800' : '#ddd') + ';">★</span>';
    }
    var replyHtml = '';
    var replies = c.replies || [];
    if (replies.length) {
      replies.forEach(function(r) {
        var roleTag = r.commentType === 'MERCHANT_REPLY'
          ? '<span class="comment-tag comment-tag-merchant">商家</span>'
          : '<span class="comment-tag comment-tag-user">用户</span>';
        replyHtml += '<div style="border-bottom:1px solid #f0f0f0;padding:4px 0;">' + roleTag + '<span style="color:#666;font-size:12px;margin-left:4px;">' + esc(r.userName || ('用户' + r.userId)) + '：</span>' + esc(r.content) + '</div>';
      });
    }
    html += '<tr>' +
      '<td>' + esc(c.spuName || ('SPU#' + c.spuId)) + '</td>' +
      '<td>' + esc(c.userName || ('用户' + c.userId)) + '</td>' +
      '<td>' + (c.commentType === 'TOP' ? stars : '—') + '</td>' +
      '<td style="max-width:200px;word-break:break-all;">' + esc(c.content) + '</td>' +
      '<td>' + (replyHtml || '<span style="color:#999;font-size:12px;">暂无回复</span>') + '</td>' +
      '<td>' +
      (c.commentType === 'TOP' ? '<button class="btn btn-sm btn-primary" onclick="openMerchantReply(' + c.id + ')">回复</button>' : '') +
      '</td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

var merchantReplyId = null;
function openMerchantReply(commentId) {
  merchantReplyId = commentId;
  var content = prompt('请输入回复内容：');
  if (content === null) return;
  if (!content.trim()) { toast('回复内容不能为空', 'error'); return; }
  submitMerchantReply(commentId, content.trim());
}

async function submitMerchantReply(commentId, content) {
  var res = await post('/merchant/comment/reply', { commentId: commentId, replyContent: content });
  if (!res) return;
  if (res.code === 200) {
    toast('回复成功');
    loadMerchantComments();
  } else {
    toast(res.msg || '回复失败', 'error');
  }
}

async function submitMerchantReply(commentId, content) {
  var res = await post('/merchant/comment/reply', { commentId: commentId, replyContent: content });

    toast('回复成功');

}

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function switchToUser() {
  window.location.href = 'http://localhost:8080/user-center.html';
}

// ==================== 进入我的店铺（商家即用户，merchantId=当前登录用户ID） ====================
function goMyShop() {
  var uid = getUserId();
  if (!uid) { toast('未获取到用户信息，请重新登录', 'error'); return; }
  window.location.href = 'http://localhost:8080/shop.html?id=' + uid;
}

// ==================== 分类下拉框 ====================
async function loadCategories() {
  var sel = document.getElementById('spuCategory');
  if (sel.options.length <= 1) {
    sel.innerHTML = '<option value="">加载中...</option>';
  }
  var res = await get('/goods/categories');
  if (!res || res.code !== 200 || !res.data) return;
  sel.innerHTML = '<option value="">-- 请选择分类 --</option>';
  res.data.forEach(function(node) {
    sel.innerHTML += '<option value="' + node.id + '">' + esc(node.name) + '</option>';
  });
}

// 打开弹窗时加载分类
var _origShowSpuForm = showSpuForm;
showSpuForm = function() {
  _origShowSpuForm();
  loadCategories();
};
var _origEditSpu = editSpu;
editSpu = function(id) {
  _origEditSpu(id);
  loadCategories().then(function() {
    var spu = spuList.find(function(s) { return s.id === id; });
    if (spu) document.getElementById('spuCategory').value = spu.categoryId || '';
  });
};
