<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - 潮汐商城</title>
<link rel="stylesheet" href="http://localhost:8080/css/style.css">
<link rel="icon" type="image/png" href="http://localhost:8080/img/logo.png">
</head>
<body data-auth="true">
<div id="navbar"></div>
<div class="container">
  <!-- 快捷入口 -->
  <div class="card" style="margin-bottom:16px;">
    <div style="display:flex;gap:16px;flex-wrap:wrap;">
      <a class="btn btn-sm" href="http://localhost:8080/address.html">📍 收货地址</a>
      <a class="btn btn-sm" href="http://localhost:8080/order-list.html">📋 我的订单</a>
      <a class="btn btn-sm" href="http://localhost:8080/cart.html">🛒 购物车</a>
      <button class="btn btn-sm btn-warning" onclick="switchRole()">🔄 切换卖家中心</button>
    </div>
  </div>

  <!-- Tab 切换 -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('profile')">👤 个人信息</button>
    <button class="tab" onclick="switchTab('myCoupons')">🎫 我的优惠券</button>
    <button class="tab" onclick="switchTab('availableCoupons')">🎁 领券中心</button>
  </div>

  <!-- 个人信息面板 -->
  <div class="card tab-panel" id="panel-profile">
    <h2>个人信息</h2>
    <form id="profileForm">
      <div class="form-group">
        <label>昵称</label>
        <input type="text" id="nickname" placeholder="昵称" maxlength="64">
      </div>
      <div class="form-group">
        <label>手机号</label>
        <input type="text" id="phone" placeholder="手机号" required maxlength="11">
      </div>
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" id="email" placeholder="邮箱">
      </div>
      <div class="form-group">
        <label>头像URL</label>
        <input type="text" id="avatar" placeholder="头像链接">
      </div>
      <div class="form-group">
        <label>性别</label>
        <select id="gender">
          <option value="0">未知</option>
          <option value="1">男</option>
          <option value="2">女</option>
        </select>
      </div>
      <div class="form-group">
        <label>密码（留空不修改）</label>
        <input type="password" id="password" placeholder="6-32位，留空不修改" minlength="6" maxlength="32">
      </div>
      <button type="submit" class="btn btn-primary">保存修改</button>
    </form>
  </div>

  <!-- 我的优惠券 -->
  <div class="card tab-panel" id="panel-myCoupons" style="display:none;">
    <h2>我的优惠券</h2>
    <div style="margin-bottom:12px;">
      <button class="btn btn-sm" onclick="loadMyCoupons('')">全部</button>
      <button class="btn btn-sm" onclick="loadMyCoupons('UNUSED')">未使用</button>
      <button class="btn btn-sm" onclick="loadMyCoupons('USED')">已使用</button>
      <button class="btn btn-sm" onclick="loadMyCoupons('EXPIRED')">已过期</button>
    </div>
    <div id="myCouponList"><div class="loading">请选择筛选条件</div></div>
  </div>

  <!-- 领券中心 -->
  <div class="card tab-panel" id="panel-availableCoupons" style="display:none;">
    <h2>可领取优惠券</h2>
    <div id="availableCouponList"><div class="loading">点击上方标签加载</div></div>
  </div>
</div>

<script src="http://localhost:8080/js/api.js"></script>
<script src="http://localhost:8080/js/common.js"></script>
<script>
// ==================== Tab 切换 ====================
function switchTab(name) {
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.style.display = 'none'; });
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  var panel = document.getElementById('panel-' + name);
  if (panel) panel.style.display = 'block';
  event.target.classList.add('active');
  if (name === 'myCoupons' && !window._myCouponsLoaded) { window._myCouponsLoaded = true; loadMyCoupons(''); }
  if (name === 'availableCoupons' && !window._availCouponsLoaded) { window._availCouponsLoaded = true; loadAvailableCoupons(); }
}

// ==================== 个人信息 ====================

// 页面加载时回填个人信息（优先从 localStorage 读取，免去数据库查询）
(function loadProfile() {
  var cached = localStorage.getItem('userInfo');
  if (cached) {
    // 从 localStorage 直接读取，无需查库
    var u = JSON.parse(cached);
    if (u.nickname) document.getElementById('nickname').value = u.nickname;
    if (u.phone) document.getElementById('phone').value = u.phone;
    if (u.email) document.getElementById('email').value = u.email;
    if (u.avatar) document.getElementById('avatar').value = u.avatar;
    if (u.gender !== undefined && u.gender !== null) document.getElementById('gender').value = u.gender;
  } else {
    // 兼容旧登录（无 userInfo）：一次性从后端拉取并缓存，之后都用 localStorage
    get('/user/info').then(function(res) {
      if (!res || res.code !== 200 || !res.data) return;
      var u = res.data;
      var info = {
        nickname: u.nickname || '',
        phone: u.phone || '',
        email: u.email || '',
        avatar: u.avatar || '',
        gender: u.gender || 0
      };
      localStorage.setItem('userInfo', JSON.stringify(info));
      if (u.nickname) document.getElementById('nickname').value = u.nickname;
      if (u.phone) document.getElementById('phone').value = u.phone;
      if (u.email) document.getElementById('email').value = u.email;
      if (u.avatar) document.getElementById('avatar').value = u.avatar;
      if (u.gender !== undefined && u.gender !== null) document.getElementById('gender').value = u.gender;
    });
  }
})();

document.getElementById('profileForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var dto = {
    nickname: document.getElementById('nickname').value.trim() || undefined,
    phone: document.getElementById('phone').value.trim(),
    email: document.getElementById('email').value.trim() || undefined,
    avatar: document.getElementById('avatar').value.trim() || undefined,
    gender: parseInt(document.getElementById('gender').value) || 0
  };
  var pwd = document.getElementById('password').value;
  if (pwd.length >= 6) dto.password = pwd;
  if (!dto.phone) { toast('手机号必填', 'error'); return; }
  var res = await post('/user/changePerDetails', dto);
  if (!res) return;
  if (res.code === 200) {
    toast('修改成功');
    // 同步更新 localStorage，保持前端缓存与后端一致
    var cached = localStorage.getItem('userInfo');
    var info = cached ? JSON.parse(cached) : {};
    if (dto.nickname !== undefined) info.nickname = dto.nickname;
    info.phone = dto.phone;
    if (dto.email !== undefined) info.email = dto.email;
    if (dto.avatar !== undefined) info.avatar = dto.avatar;
    info.gender = dto.gender;
    localStorage.setItem('userInfo', JSON.stringify(info));
  } else {
    toast(res.msg || '修改失败', 'error');
  }
});

// ==================== 工具函数 ====================

// 格式化 ISO 日期字符串为 yyyy-MM-dd HH:mm:ss
function formatDate(isoStr) {
  if (!isoStr) return '';
  // ISO格式如 2026-08-31T15:59:59.000+00:00 → 2026-08-31 15:59:59
  if (typeof isoStr === 'string' && isoStr.length >= 19) {
    return isoStr.substring(0, 10) + ' ' + isoStr.substring(11, 19);
  }
  return isoStr;
}

// 状态文案映射
var STATUS_MAP = { 'UNUSED': '未使用', 'USED': '已使用', 'EXPIRED': '已过期' };
function statusLabel(s) { return STATUS_MAP[s] || s || ''; }

// 优惠类型文案
function couponTypeLabel(c) {
  if (c.type === 'FULL_REDUCTION') return '满' + (c.minAmount || 0) + '减' + (c.discountValue || 0);
  if (c.type === 'DISCOUNT') return '满' + (c.minAmount || 0) + '打' + ((c.discountValue || 0) * 10).toFixed(1) + '折';
  return '满' + (c.minAmount || 0) + '减' + (c.discountValue || 0);
}

// ==================== 我的优惠券 ====================
async function loadMyCoupons(status) {
  var list = document.getElementById('myCouponList');
  list.innerHTML = '<div class="loading"><span class="spinner"></span>加载中...</div>';
  var params = {};
  if (status) params.status = status;
  var res = await get('/user/coupon/mine', params);
  if (!res || res.code !== 200) { list.innerHTML = '<div class="loading">加载失败</div>'; return; }
  var coupons = res.data || [];
  if (!coupons.length) { list.innerHTML = '<div class="loading">暂无优惠券</div>'; return; }
  var html = '';
  coupons.forEach(function(c) {
    html +=
      '<div class="coupon-card">' +
      '  <div class="coupon-amount">¥' + (c.discountValue || 0) + '</div>' +
      '  <div class="coupon-info">' +
      '    <div><strong>' + esc(c.couponName || c.name || '优惠券') + '</strong></div>' +
      '    <div style="color:#999;font-size:13px;">' + statusLabel(c.status) + ' · ' + couponTypeLabel(c) + '</div>' +
      '    <div style="color:#999;font-size:12px;">有效期至 ' + formatDate(c.endTime) + '</div>' +
      '  </div>' +
      '</div>';
  });
  list.innerHTML = html;
}

// ==================== 领券中心 ====================
async function loadAvailableCoupons() {
  var list = document.getElementById('availableCouponList');
  list.innerHTML = '<div class="loading"><span class="spinner"></span>加载中...</div>';
  var res = await get('/user/coupon/available');
  if (!res || res.code !== 200) { list.innerHTML = '<div class="loading">加载失败</div>'; return; }
  var coupons = res.data || [];
  if (!coupons.length) { list.innerHTML = '<div class="loading">暂无可领取优惠券</div>'; return; }
  var html = '';
  coupons.forEach(function(c) {
    var collected = c.alreadyCollected === true;
    html +=
      '<div class="coupon-card">' +
      '  <div class="coupon-amount">¥' + (c.discountValue || 0) + '</div>' +
      '  <div class="coupon-info">' +
      '    <div><strong>' + esc(c.name || c.couponName || '优惠券') + '</strong></div>' +
      '    <div style="color:#999;font-size:13px;">' + couponTypeLabel(c) + ' · 有效期至 ' + formatDate(c.endTime) + '</div>' +
      '  </div>' +
      '  <button class="btn btn-sm ' + (collected ? 'btn-default' : 'btn-primary') + '" ' +
            (collected ? 'disabled' : 'onclick="collectCoupon(' + c.id + ')"') + '>' +
            (collected ? '已领取' : '立即领取') + '</button>' +
      '</div>';
  });
  list.innerHTML = html;
}

async function collectCoupon(couponId) {
  var res = await post('/user/coupon/collect/' + couponId);
  if (!res) return;
  if (res.code === 200) {
    toast('领取成功！');
    loadAvailableCoupons();
  } else {
    toast(res.msg || '领取失败', 'error');
  }
}

// ==================== 切换角色 ====================
async function switchRole() {
  var res = await post('/user/changePage');
  if (!res) return;
  if (res.code === 200) {
    toast('已切换为卖家中心');
    setTimeout(function() { window.location.href = 'http://localhost:8080/merchant.html'; }, 800);
  } else {
    toast(res.msg || '切换失败', 'error');
  }
}

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
</script>
</body>
</html>
