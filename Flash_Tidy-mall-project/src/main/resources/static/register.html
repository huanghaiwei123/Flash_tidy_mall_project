<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 潮汐商城</title>
<link rel="stylesheet" href="http://localhost:8080/css/style.css">
<link rel="icon" type="image/png" href="http://localhost:8080/img/logo.png">
</head>
<body>
<div class="auth-page">
  <div class="card auth-card">
    <h1><span class="icon">🌊</span> 潮汐商城</h1>
    <p class="subtitle">注册账号，开启购物之旅</p>
    <form id="regForm">
      <div class="form-group">
        <label>手机号</label>
        <input type="text" id="phone" placeholder="请输入手机号" maxlength="11" required>
        <div class="err-msg" id="phoneErr"></div>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="6-32位密码" required>
        <div class="err-msg" id="pwdErr"></div>
      </div>
      <div class="form-group">
        <label>确认密码</label>
        <input type="password" id="confirmPwd" placeholder="再次输入密码" required>
        <div class="err-msg" id="confirmErr"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">注 册</button>
    </form>
    <div class="form-footer">已有账号？<a href="http://localhost:8080/login.html">去登录</a></div>
  </div>
</div>
<script src="http://localhost:8080/js/api.js"></script>
<script src="http://localhost:8080/js/common.js"></script>
<script>
document.getElementById('regForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var phone = document.getElementById('phone').value.trim();
  var pwd = document.getElementById('password').value;
  var confirm = document.getElementById('confirmPwd').value;
  if (!phone) { toast('请输入手机号', 'error'); return; }
  if (!/^1[3-9]\d{9}$/.test(phone)) { toast('手机号格式不正确', 'error'); return; }
  if (pwd.length < 6) { toast('密码至少6位', 'error'); return; }
  if (pwd !== confirm) { toast('两次密码不一致', 'error'); return; }
  var res = await post('/register', { phone: phone, password: pwd });
  if (!res) return;
  if (res.code === 200) {
    toast('注册成功，请登录');
    setTimeout(function() { window.location.href = 'http://localhost:8080/login.html'; }, 800);
  } else {
    toast(res.msg || '注册失败', 'error');
  }
});
</script>
</body>
</html>
