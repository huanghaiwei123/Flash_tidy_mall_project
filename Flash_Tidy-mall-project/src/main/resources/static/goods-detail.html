<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品详情 - 潮汐商城</title>
<link rel="stylesheet" href="http://localhost:8080/css/style.css">
<link rel="icon" type="image/png" href="http://localhost:8080/img/logo.png">
</head>
<body>
<div id="navbar"></div>
<div class="container" id="detailContainer">
  <div class="loading"><span class="spinner"></span>加载中...</div>
</div>
<script src="http://localhost:8080/js/api.js"></script>
<script src="http://localhost:8080/js/common.js"></script>
<script>
var spuId = new URLSearchParams(window.location.search).get('id');
var skuList = [];
var selectedSku = null;
var quantity = 1;

async function loadDetail() {
  if (!spuId) { document.getElementById('detailContainer').innerHTML = '<div class="loading">商品不存在</div>'; return; }
  var res = await get('/goods/' + spuId);
  if (!res || res.code !== 200) { document.getElementById('detailContainer').innerHTML = '<div class="loading">' + (res && res.msg || '商品不存在或已下架') + '</div>'; return; }
  var spu = res.data;
  skuList = spu.skuList || [];
  if (skuList.length > 0) selectedSku = skuList[0];
  renderDetail(spu);
  loadComments(1);
}

function renderDetail(spu) {
  var container = document.getElementById('detailContainer');
  var skuHtml = '';
  if (skuList.length) {
    skuList.forEach(function(sku, i) {
      skuHtml +=
        '<div class="sku-item ' + (i === 0 ? 'active' : '') + '" onclick="selectSku(' + i + ')" id="sku_' + i + '">' +
        esc(sku.name) + '<span class="sku-price">¥' + (sku.price || 0) + '</span>' +
        '</div>';
    });
  }
  container.innerHTML =
    '<div class="detail-layout">' +
    '  <img class="detail-img" src="' + (spu.mainImage || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22><rect fill=%22%23eee%22 width=%22400%22 height=%22400%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23ccc%22 font-size=%2240%22>暂无图片</text></svg>') + '" alt="' + spu.name + '">' +
    '  <div class="detail-info">' +
    '    <h1>' + esc(spu.name) + '</h1>' +
    '    <div class="detail-price">¥<span id="curPrice">' + (skuList.length ? (skuList[0].price || 0) : '--') + '</span>' +
    (skuList.length && skuList[0].originalPrice ? '<span class="detail-original">¥' + skuList[0].originalPrice + '</span>' : '') +
    '    </div>' +
    (spu.brand ? '<p style="color:#999;font-size:14px;">品牌：' + esc(spu.brand) + '</p>' : '') +
    (spu.categoryName ? '<p style="color:#999;font-size:14px;">分类：' + esc(spu.categoryName) + '</p>' : '') +
    (spu.merchantId ? '<p style="margin-top:8px;"><a href="shop.html?id=' + spu.merchantId + '" style="color:#e4393c;text-decoration:none;font-size:14px;">🏪 进入店铺</a></p>' : '') +
    '<p style="color:#999;font-size:14px;">已售 ' + (spu.sales || 0) + ' 件</p>' +
    (skuList.length ? '<h3 style="margin-top:16px;">规格选择</h3><div class="sku-list">' + skuHtml + '</div>' : '') +
    (skuList.length ? '<div class="quantity-ctrl"><span>数量：</span><button onclick="changeQty(-1)">-</button><input type="number" id="qty" value="1" min="1" onchange="onQtyChange()"><button onclick="changeQty(1)">+</button></div>' : '') +
    '    <button class="btn btn-accent" style="margin-top:20px;padding:14px 48px;font-size:16px;" onclick="addToCart()" ' + (!skuList.length ? 'disabled' : '') + '>🛒 加入购物车</button>' +
    (spu.description ? '<p style="margin-top:16px;color:#666;">' + esc(spu.description) + '</p>' : '') +
    '  </div>' +
    '</div>' +
    (spu.detail ? '<div class="card" style="margin-top:20px;"><h2>商品详情</h2><div>' + spu.detail + '</div></div>' : '') +
    '<div class="card" style="margin-top:20px;" id="commentSection">' +
    '  <h2>商品评价</h2>' +
    '  <div id="commentBox"></div>' +
    '</div>';
}

// ====== 评论模块 ======
var commentPage = 1;
var commentSize = 10;

async function loadComments(page) {
  commentPage = page || 1;
  var res = await get('/comment/list/' + spuId, { page: commentPage, size: commentSize });
  if (!res || res.code !== 200) { document.getElementById('commentBox').innerHTML = '<p style="color:#999;">评论加载失败</p>'; return; }
  renderComments(res.data);
}

function renderComments(pageObj) {
  var records = (pageObj && pageObj.records) || [];
  var box = document.getElementById('commentBox');
  if (!records.length) {
    box.innerHTML = '<p style="color:#999;">暂无评价，快来发表第一条评论吧</p>' + commentFormHtml();
    return;
  }
  var html = '';
  records.forEach(function(c) {
    html += commentItemHtml(c);
  });
  // 分页
  var total = (pageObj && pageObj.total) || 0;
  var pages = (pageObj && pageObj.pages) || 1;
  html += '<div style="margin-top:16px;text-align:center;">';
  if (commentPage > 1) html += '<button class="btn" onclick="loadComments(' + (commentPage - 1) + ')">上一页</button> ';
  html += '<span style="color:#999;">第 ' + commentPage + ' / ' + pages + ' 页</span> ';
  if (commentPage < pages) html += '<button class="btn" onclick="loadComments(' + (commentPage + 1) + ')">下一页</button>';
  html += '</div>';
  html += commentFormHtml();
  box.innerHTML = html;
}

function commentItemHtml(c) {
  var stars = '';
  for (var i = 1; i <= 5; i++) {
    stars += '<span class="' + (i <= (c.rating || 0) ? 'star-on' : 'star-off') + '">★</span>';
  }
  var tags = '';
  if (c.orderNo) tags += '<span class="comment-tag comment-tag-bought">✔ 已购买</span>';
  var typeTag = c.commentType === 'MERCHANT_REPLY'
    ? '<span class="comment-tag comment-tag-merchant">商家回复</span>'
    : (c.commentType === 'USER_REPLY' ? '<span class="comment-tag comment-tag-user">用户回复</span>' : '');
  var replyTo = c.replyUserId ? '<span style="color:#666;font-size:13px;"> 回复 @' + esc(c.replyUserName || '') + '</span>' : '';
  var repliesHtml = '';
  var replies = c.replies || [];
  replies.forEach(function(r) {
    var roleTag = r.commentType === 'MERCHANT_REPLY'
      ? '<span class="comment-tag comment-tag-merchant">商家</span>'
      : '<span class="comment-tag comment-tag-user">用户</span>';
    repliesHtml += '<div class="comment-reply-box">' +
      roleTag +
      '<span class="reply-user"> ' + esc(r.userName || ('用户' + r.userId)) + '</span>' +
      '<span class="reply-user"> 回复 @' + esc(r.replyUserName || '') + '：</span>' +
      '<span class="reply-content">' + esc(r.content) + '</span>' +
      '<div class="reply-time">' + (r.createTime || '').replace('T', ' ') + '</div>' +
      '<button class="btn btn-sm" style="margin-top:4px;" onclick="openReply(' + r.id + ',' + (r.userId || 'null') + ')">回复</button>' +
      '</div>';
  });
  return '<div class="comment-item">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;">' +
    '  <div><span style="font-weight:600;">' + esc(c.userName || ('用户' + c.userId)) + '</span>' + replyTo + '</div>' +
    '  <span style="color:#ccc;font-size:12px;">' + (c.createTime || '').replace('T', ' ') + '</span>' +
    '</div>' +
    (c.commentType === 'TOP' ? '<div class="comment-stars">' + stars + '</div>' : '') +
    '<div style="margin-top:8px;">' + typeTag + tags + '</div>' +
    '<p style="margin-top:8px;color:#333;">' + esc(c.content) + '</p>' +
    '<button class="btn btn-sm" style="margin-top:8px;" onclick="openReply(' + c.id + ',' + (c.userId || 'null') + ')">回复</button>' +
    repliesHtml +
    '</div>';
}

function commentFormHtml() {
  if (!isLogin()) {
    return '<div style="margin-top:20px;padding-top:16px;border-top:1px solid #eee;">' +
      '<p style="color:#999;">登录后即可发表评论</p>' +
      '<a href="http://localhost:8080/login.html" class="btn btn-primary">去登录</a></div>';
  }
  return '<div style="margin-top:20px;padding-top:16px;border-top:1px solid #eee;">' +
    '<h3>发表评论</h3>' +
    '<div style="margin:12px 0;">' +
    '  <span>评分：</span>' +
    '  <select id="cmtRating" style="padding:4px 8px;">' +
    '    <option value="5">★★★★★ 5分</option>' +
    '    <option value="4">★★★★ 4分</option>' +
    '    <option value="3">★★★ 3分</option>' +
    '    <option value="2">★★ 2分</option>' +
    '    <option value="1">★ 1分</option>' +
    '  </select>' +
    '</div>' +
    '<textarea id="cmtContent" placeholder="说说你对这个商品的看法..." maxlength="500" rows="3" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;resize:vertical;"></textarea>' +
    '<div style="margin-top:10px;">' +
    '  <button class="btn btn-primary" onclick="submitComment()">发表评论</button>' +
    '</div>' +
    '<div id="replyBox" style="display:none;margin-top:12px;padding:12px;background:#f5f5f5;border-radius:6px;">' +
    '  <p style="color:#666;" id="replyBoxTitle"></p>' +
    '  <textarea id="replyContent" placeholder="输入回复内容..." maxlength="300" rows="2" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;"></textarea>' +
    '  <div style="margin-top:8px;">' +
    '    <button class="btn btn-primary" onclick="submitReply()">提交回复</button>' +
    '    <button class="btn" onclick="closeReply()">取消</button>' +
    '  </div>' +
    '</div>' +
    '</div>';
}

var replyTarget = null; // { parentId, replyUserId }

function openReply(parentId, replyUserId) {
  replyTarget = { parentId: parentId, replyUserId: replyUserId };
  var box = document.getElementById('replyBox');
  document.getElementById('replyBoxTitle').textContent = replyUserId ? '回复 @用户' + replyUserId : '回复评论';
  box.style.display = 'block';
  document.getElementById('replyContent').value = '';
}

function closeReply() {
  replyTarget = null;
  document.getElementById('replyBox').style.display = 'none';
}

async function submitComment() {
  var content = document.getElementById('cmtContent').value.trim();
  if (!content) { toast('请输入评论内容', 'error'); return; }
  var body = {
    spuId: spuId,
    rating: parseInt(document.getElementById('cmtRating').value),
    content: content
  };
  var res = await post('/comment', body);
  if (!res) return;
  if (res.code === 200) {
    toast('评论成功');
    document.getElementById('cmtContent').value = '';
    loadComments(1);
  } else {
    toast(res.msg || '评论失败', 'error');
  }
}

async function submitReply() {
  if (!replyTarget) { toast('请先选择要回复的评论', 'error'); return; }
  var content = document.getElementById('replyContent').value.trim();
  if (!content) { toast('请输入回复内容', 'error'); return; }
  var body = {
    spuId: spuId,
    parentId: replyTarget.parentId,
    content: content
  };
  var res = await post('/comment', body);
  if (!res) return;
  if (res.code === 200) {
    toast('回复成功');
    closeReply();
    loadComments(commentPage);
  } else {
    toast(res.msg || '回复失败', 'error');
  }
}

function selectSku(idx) {
  selectedSku = skuList[idx];
  document.querySelectorAll('.sku-item').forEach(function(el,i) { el.classList.toggle('active', i === idx); });
  document.getElementById('curPrice').textContent = selectedSku.price || 0;
  var origEl = document.querySelector('.detail-original');
  if (origEl) origEl.textContent = selectedSku.originalPrice ? '¥' + selectedSku.originalPrice : '';
}

function changeQty(d) {
  quantity = Math.max(1, quantity + d);
  document.getElementById('qty').value = quantity;
}
function onQtyChange() {
  var v = parseInt(document.getElementById('qty').value) || 1;
  quantity = Math.max(1, v);
}

async function addToCart() {
  if (!isLogin()) { window.location.href = 'http://localhost:8080/login.html'; return; }
  if (!selectedSku) { toast('请选择规格', 'error'); return; }
  var res = await post('/user/cart?spuId=' + spuId + '&skuId=' + selectedSku.id + '&quantity=' + quantity);
  if (!res) return;
  if (res.code === 200) {
    toast('已加入购物车');
  } else {
    toast(res.msg || '操作失败', 'error');
  }
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

loadDetail();
</script>
</body>
</html>
