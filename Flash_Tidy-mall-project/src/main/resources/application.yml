server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: always

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/flash_mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:192.168.147.131}
    port: 6379
    timeout: 10s
    lettuce:
      pool:
        max-active: 200
        max-idle: 50
        min-idle: 10
        max-wait: 3000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.147.131}
    port: 5672
    username: ${RABBITMQ_USERNAME:guess}
    password: ${RABBITMQ_PASSWORD:guess}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: 50
        concurrency: 3
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
  elasticsearch:
    uris: http://192.168.147.131:9200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key-32-long-2026}
  expiration: ${JWT_EXPIRATION:7200000}

# 前端地址
app:
  frontend-url: http://localhost:8080

# 支付宝沙箱
alipay:
  app-id: ${ALIPAY_APP_ID:9021000166629203}
  private-key: ${ALIPAY_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: ${ALIPAY_NOTIFY_URL:http://y8ec6a44.natappfree.cc/hhw/pay/notify}
  return-url: ${ALIPAY_RETURN_URL:http://localhost:8080/hhw/pay/return}
  signType: RSA2
  charset: utf-8

# 日志
logging:
  level:
    com.gdou: info

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: flash-mall


# Ollama 本地模型
ollama:
  base-url: http://localhost:11434
  model: qwen2.5:3b
  temperature: 0.7