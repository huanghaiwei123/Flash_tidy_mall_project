version: '3.8'
services:
  seckill-app:
    build: .
    container_name: seckill-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/seckill_project?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_REDIS_CLUSTER_NODES=192.168.147.131:7000,192.168.147.131:7001,192.168.147.131:7002,192.168.147.131:7003,192.168.147.131:7004,192.168.147.131:7005
      - SPRING_RABBITMQ_HOST=192.168.147.131
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
    extra_hosts:
      - "host.docker.internal:host-gateway"
